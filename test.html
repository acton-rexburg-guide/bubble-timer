<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Timer (TEST)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#e0f4ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #e0f4ff;
    --bg2: #fde7f3;
    --ring-track: #ffffffcc;
    --ring: #7cc6fe;
    --ring2: #b39cfb;
    --text: #3b4a7a;
    --btn: #ff9fc6;
    --btn-shadow: #e7779f;
    --done: #8fe3b0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Fredoka", "Nunito", "Varela Round", "Arial Rounded MT Bold", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: grid;
    place-items: center;
    overflow: hidden;
    user-select: none;
  }
  .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bubble {
    position: absolute;
    bottom: -120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffffee, #ffffff55 40%, #bfe6ff44 70%, transparent 72%);
    border: 2px solid #ffffff99;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: .9; }
    50%  { transform: translate(24px, -55vh); }
    100% { transform: translate(-12px, -115vh); opacity: 0; }
  }
  main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 5vmin;
    padding: 16px;
  }
  .dial { position: relative; width: min(70vmin, 520px); aspect-ratio: 1; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--ring-track); stroke-width: 18; }
  .progress {
    fill: none; stroke: url(#grad); stroke-width: 18; stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
  .face {
    position: absolute; inset: 0;
    display: grid; place-items: center; text-align: center;
  }
  .time { font-size: min(17vmin, 128px); font-weight: 700; letter-spacing: .02em; line-height: 1; }
  .label { font-size: min(4.5vmin, 30px); opacity: .75; margin-top: 1vmin; }
  .dial.running { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.02); } }
  .dial.done { animation: wiggle 1.2s ease-in-out infinite; }
  @keyframes wiggle { 25% { transform: rotate(-2deg) scale(1.03); } 75% { transform: rotate(2deg) scale(1.03); } }

  button {
    font: inherit; font-weight: 700;
    font-size: min(7vmin, 44px);
    color: #fff;
    background: var(--btn);
    border: none; border-radius: 999px;
    padding: .45em 1.6em;
    box-shadow: 0 .18em 0 var(--btn-shadow), 0 .5em 1.2em #e7779f55;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(.14em); box-shadow: 0 .04em 0 var(--btn-shadow); }
  button:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
  button.running { background: #6fd39b; box-shadow: 0 .18em 0 #4fb07b, 0 .5em 1.2em #4fb07b55; }
  button.running:active { box-shadow: 0 .04em 0 #4fb07b; }
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<main>
  <div class="dial" id="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7cc6fe"/>
          <stop offset="100%" stop-color="#b39cfb"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="100" cy="100" r="88"/>
      <circle class="progress" id="progress" cx="100" cy="100" r="88"/>
    </svg>
    <div class="face">
      <div>
        <div class="time" id="time" role="timer" aria-live="off">0:30</div>
        <div class="label" id="label">Ready?</div>
      </div>
    </div>
  </div>
  <button id="start">Start</button>
</main>

<script>
const TOTAL = 30; // seconds
const timeEl = document.getElementById('time');
const labelEl = document.getElementById('label');
const btn = document.getElementById('start');
const dial = document.getElementById('dial');
const ring = document.getElementById('progress');
const C = 2 * Math.PI * 88;
ring.style.strokeDasharray = C;
ring.style.strokeDashoffset = 0;

const OVERTIME = 30 * 60;      // auto-reset after this long past zero
const REMIND_EVERY = 60;       // chime again every minute past zero

let endAt = 0, tick = null, audio = null, alarmTimer = null, lastChimeAt = null, wiggleTimer = null;

function fmt(s) {
  const neg = s < 0, a = Math.abs(s);
  const m = Math.floor(a / 60), r = a % 60;
  return (neg ? '−' : '') + m + ':' + String(r).padStart(2, '0');
}
function render(left) {
  timeEl.textContent = fmt(left);
  ring.style.strokeDashoffset = C * (1 - Math.max(0, left) / TOTAL);
}

// Gentle chime: soft sine notes with slow fade in/out
function chime() {
  if (!audio) return;
  const notes = [523.25, 659.25, 783.99]; // C5 E5 G5
  const t0 = audio.currentTime;
  notes.forEach((f, i) => {
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    const t = t0 + i * 0.45;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 2.3);
  });
}
// One alarm = 5 soft chimes over ~20 seconds, with a little wiggle
function startAlarm() {
  stopAlarm();
  bringToFront();
  let count = 0;
  chime();
  alarmTimer = setInterval(() => {
    if (++count >= 5) { clearInterval(alarmTimer); return; }
    chime();
  }, 4500);
  dial.classList.add('done');
  clearTimeout(wiggleTimer);
  wiggleTimer = setTimeout(() => dial.classList.remove('done'), 20000);
}
// Ask the companion extension (if installed) to bring this window to the front
function bringToFront() {
  window.postMessage({ source: 'bubble-timer', type: 'focus' }, location.origin);
}
function stopAlarm() { clearInterval(alarmTimer); alarmTimer = null; }

function start() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  stopAlarm();
  endAt = Date.now() + TOTAL * 1000;
  lastChimeAt = null;
  dial.classList.add('running');
  labelEl.textContent = 'You can do it!';
  btn.textContent = "I'm Done";
  btn.classList.add('running');
  render(TOTAL);
  clearInterval(tick);
  tick = setInterval(update, 250);
}
function update() {
  const left = Math.ceil((endAt - Date.now()) / 1000);
  if (left <= -OVERTIME) { reset(); return; }
  render(left);
  if (left <= 0) {
    // chime at 0, then at −1:00, −2:00, … −29:00
    const mark = Math.floor(-left / REMIND_EVERY) * REMIND_EVERY;
    if (lastChimeAt !== mark) {
      lastChimeAt = mark;
      dial.classList.remove('running');
      labelEl.textContent = "Time's up! 🎉";
      startAlarm();
    }
  }
}
function reset() {
  clearInterval(tick);
  stopAlarm();
  clearTimeout(wiggleTimer);
  dial.classList.remove('running', 'done');
  labelEl.textContent = 'Ready?';
  btn.textContent = 'Start';
  btn.classList.remove('running');
  render(TOTAL);
}
btn.addEventListener('click', () => btn.classList.contains('running') ? reset() : start());

// Installable app: register the offline service worker
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// Floating bubbles
const wrap = document.getElementById('bubbles');
for (let i = 0; i < 16; i++) {
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 30 + Math.random() * 90;
  b.style.width = b.style.height = size + 'px';
  b.style.left = Math.random() * 100 + 'vw';
  b.style.animationDuration = 14 + Math.random() * 14 + 's';
  b.style.animationDelay = -Math.random() * 28 + 's';
  wrap.appendChild(b);
}
</script>
</body>
</html>
